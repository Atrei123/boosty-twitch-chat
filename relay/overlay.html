<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boosty Chat Overlay</title>
<style>
  /*
   * Параметры (в адресе после ?):
   *   bg=transparent | dark | <hex без #>   фон (по умолчанию прозрачный)
   *   bgalpha=100      непрозрачность фона, 0–100 (для bg=dark или цвета)
   *   plate=0          подложка под каждым сообщением, 0–100 (0 — без подложки)
   *   alpha=100        непрозрачность самих сообщений, 5–100
   *   font=18          размер шрифта, px
   *   fade=0           через сколько секунд скрывать сообщение (0 — не скрывать)
   *   max=40           сколько сообщений держать на экране
   *   time=0           показывать время
   *   avatars=0        показывать аватарки
   *   badges=1         значки стримера / модератора
   *   shadow=1         обводка текста, чтобы читалось поверх игры
   *   history=1        показывать сообщения, которые уже были в чате при открытии
   *   hide=bot1,bot2   скрыть сообщения этих ников
   *   commands=1       0 — скрыть сообщения, начинающиеся с «!»
   *   system=0         1 — показывать системные сообщения Boosty («Добро пожаловать в чат» и т.п.)
   *   deleted=0        1 — показывать «<сообщение удалено>» вместо того, чтобы убирать строку
   *   status=0         1 — показывать подсказку о соединении (для настройки, не для эфира)
   */
  :root { --fs: 18px; --bg: transparent; --plate: 0; --alpha: 1; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    color: #efeff1; font: 600 var(--fs)/1.45 Inter, Roobert, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Новые снизу, старые уезжают вверх и обрезаются — как у чата Twitch в OBS. */
  #chat { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 8px 10px; box-sizing: border-box; opacity: var(--alpha); }
  .line { padding: 2px 6px; overflow-wrap: anywhere; word-break: break-word;
    animation: in .18s ease-out both; }
  .shadow .line { text-shadow: 0 0 2px #000, 0 0 2px #000, 1px 1px 2px #000, -1px -1px 2px #000; }
  .solid .line { text-shadow: none; }
  .plate .line { background: rgba(0, 0, 0, var(--plate)); border-radius: 6px; padding: 4px 9px; margin-top: 4px; }
  .line.out { animation: out .5s ease-in forwards; }
  .line.deleted .text { color: #adadb8; font-style: italic; }
  .reply { display: block; color: #d3d3d9; font-size: .78em; font-weight: 500; opacity: .85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { color: #c8c8d0; font-size: .82em; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .avatar { width: 1.3em; height: 1.3em; border-radius: 50%; vertical-align: middle; margin: -.25em 5px 0 0; object-fit: cover; }
  .badge { display: inline-flex; align-items: center; justify-content: center; width: 1.1em; height: 1.1em;
    border-radius: .18em; vertical-align: middle; margin: -.2em 5px 0 0; }
  .badge svg { width: 70%; height: 70%; fill: #fff; }
  .badge.streamer { background: #e91916; }
  .badge.moderator { background: #00ad03; }
  .name { font-weight: 800; }
  .colon { margin-right: 5px; }
  .text { font-weight: 500; }
  .emote { height: 1.8em; vertical-align: middle; margin: -.4em 1px; }
  .mention { font-weight: 800; }
  .link { color: #bf94ff; }
  .system { color: #c8c8d0; font-style: italic; font-weight: 500; }
  #status { position: absolute; left: 10px; bottom: 10px; padding: 6px 10px; border-radius: 6px;
    background: rgba(0,0,0,.7); color: #fff; font: 500 13px/1.4 Inter, Arial, sans-serif; text-shadow: none; }
  #status[hidden] { display: none; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes out { to { opacity: 0; } }
</style>
</head>
<body>
<div id="chat" aria-live="polite"></div>
<div id="status" hidden></div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) && !Number.isNaN(+q.get(k)) ? +q.get(k) : d);
  const flag = (k, d) => (q.has(k) ? !['0', 'false', 'no', 'off'].includes(q.get(k)) : d);
  const opt = {
    bg: q.get('bg') || 'transparent',
    bgalpha: Math.min(100, Math.max(0, num('bgalpha', 100))),
    plate: Math.min(100, Math.max(0, num('plate', 0))),
    alpha: Math.min(100, Math.max(5, num('alpha', 100))),
    font: num('font', 18),
    fade: num('fade', 0),
    max: Math.max(1, num('max', 40)),
    time: flag('time', false),
    avatars: flag('avatars', false),
    badges: flag('badges', true),
    shadow: flag('shadow', true),
    history: flag('history', true),
    commands: flag('commands', true),
    deleted: flag('deleted', false),
    system: flag('system', false),
    status: flag('status', false),
    hide: new Set((q.get('hide') || '').split(',').map((s) => s.trim().toLowerCase()).filter(Boolean)),
  };

  const root = document.documentElement;
  root.style.setProperty('--fs', `${opt.font}px`);
  const bgHex = opt.bg === 'dark' ? '18181b' : (/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(opt.bg) ? opt.bg : '');
  if (bgHex && opt.bgalpha > 0) {
    const full = bgHex.length === 3 ? [...bgHex].map((c) => c + c).join('') : bgHex;
    const [r, g, b] = [0, 2, 4].map((i) => parseInt(full.slice(i, i + 2), 16));
    root.style.setProperty('--bg', `rgba(${r}, ${g}, ${b}, ${opt.bgalpha / 100})`);
    // На плотном фоне обводка не нужна; на полупрозрачном поверх игры она помогает читать.
    if (opt.bgalpha >= 80) document.body.classList.add('solid');
  }
  if (opt.plate > 0) { root.style.setProperty('--plate', opt.plate / 100); document.body.classList.add('plate'); }
  root.style.setProperty('--alpha', opt.alpha / 100);
  if (opt.shadow) document.body.classList.add('shadow');

  const chat = document.getElementById('chat');
  const statusEl = document.getElementById('status');
  const ICONS = {
    streamer: '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>',
    moderator: '<svg viewBox="0 0 24 24"><path d="M12 1.8l8.5 3.2v6.3c0 5.3-3.6 9.8-8.5 11.3-4.9-1.5-8.5-6-8.5-11.3V5z"/></svg>',
  };
  const isHttp = (u) => typeof u === 'string' && /^https?:\/\//i.test(u);

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function readable(color) {
    const probe = document.createElement('span');
    probe.style.color = color || '#B8AAFF';
    const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(probe.style.color);
    if (!m) return '#B8AAFF';
    let rgb = m.slice(1, 4).map(Number);
    const lum = (c) => {
      const [r, g, b] = c.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    };
    for (let i = 0; i < 10 && lum(rgb) < 0.12; i++) rgb = rgb.map((v) => Math.round(v + (255 - v) * 0.18));
    return `rgb(${rgb.join(',')})`;
  }

  function plainText(parts) {
    return (parts || []).map((p) => (p.type === 'emote' ? p.alt || '' : p.text || '')).join('').trim();
  }

  function visible(m) {
    if (m.kind === 'system') return opt.system;
    if (opt.hide.has(String(m.name || '').toLowerCase())) return false;
    if (!opt.commands && plainText(m.parts).startsWith('!')) return false;
    if (m.deleted && !opt.deleted) return false;
    return true;
  }

  function renderParts(target, parts) {
    for (const p of parts || []) {
      if (p.type === 'text') target.append(p.text);
      else if (p.type === 'emote' && isHttp(p.src)) {
        const img = el('img', 'emote');
        img.src = p.src; img.alt = p.alt || '';
        target.append(img);
      } else if (p.type === 'emote') target.append(p.alt || '');
      else if (p.type === 'mention') target.append(el('span', 'mention', `@${p.text}`));
      else if (p.type === 'link') target.append(el('span', 'link', p.text || p.href));
    }
  }

  function renderLine(m) {
    const line = el('div', 'line');
    line.dataset.id = m.id;
    if (m.kind === 'system') {
      line.classList.add('system');
      renderParts(line, m.parts);
      return line;
    }
    if (m.deleted) line.classList.add('deleted');
    if (m.reply && (m.reply.author || m.reply.text)) {
      line.append(el('span', 'reply', `↪ ${m.reply.author ? `@${m.reply.author}: ` : ''}${m.reply.text || ''}`));
    }
    if (opt.time && m.time) line.append(el('span', 'time', m.time));
    if (opt.avatars && isHttp(m.avatar)) {
      const img = el('img', 'avatar');
      img.src = m.avatar; img.alt = '';
      line.append(img);
    }
    if (opt.badges && ICONS[m.role]) {
      const b = el('span', `badge ${m.role}`);
      b.innerHTML = ICONS[m.role];
      line.append(b);
    }
    const name = el('span', 'name', m.name || '');
    name.style.color = readable(m.color);
    line.append(name, el('span', 'colon', ':'));
    const text = el('span', 'text');
    if (m.deleted) text.textContent = '<сообщение удалено>';
    else renderParts(text, m.parts);
    line.append(text);
    return line;
  }

  function scheduleFade(line, m, initial) {
    if (!opt.fade) return;
    const age = Date.now() - (m.ts || Date.now());
    const left = opt.fade * 1000 - (initial ? age : 0);
    setTimeout(() => {
      line.classList.add('out');
      line.addEventListener('animationend', () => line.remove(), { once: true });
    }, Math.max(0, left));
  }

  function add(m, initial) {
    if (!m || !m.id || chat.querySelector(`[data-id="${CSS.escape(m.id)}"]`)) return;
    if (!visible(m)) return;
    if (initial && opt.fade && Date.now() - (m.ts || 0) > opt.fade * 1000) return;
    const line = renderLine(m);
    if (initial) line.style.animation = 'none';
    chat.append(line);
    scheduleFade(line, m, initial);
    while (chat.children.length > opt.max) chat.firstElementChild.remove();
  }

  function remove(id) {
    const line = chat.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!line) return;
    if (opt.deleted) {
      line.classList.add('deleted');
      const t = line.querySelector('.text');
      if (t) t.textContent = '<сообщение удалено>';
    } else {
      line.remove();
    }
  }

  function showStatus(text) {
    if (!opt.status || !text || chat.children.length) { statusEl.hidden = true; return; }
    statusEl.textContent = text;
    statusEl.hidden = false;
  }

  let es;
  function connect() {
    es = new EventSource('/events');
    es.onmessage = (e) => {
      let ev;
      try { ev = JSON.parse(e.data); } catch { return; }
      if (ev.type === 'replay') {
        chat.textContent = '';
        for (const m of ev.messages || []) if (opt.history || !m.history) add(m, true);
      } else if (ev.type === 'message') {
        if (opt.history || !ev.msg.history) add(ev.msg, false);
      } else if (ev.type === 'delete') {
        remove(ev.id);
      } else if (ev.type === 'clear') {
        chat.textContent = '';
      } else if (ev.type === 'status') {
        showStatus(ev.boostyConnected ? '' : 'Ждём чат Boosty: откройте страницу чата в браузере с расширением');
      }
    };
    es.onerror = () => showStatus('Нет связи с relay — запустите relay/start');
    es.onopen = () => showStatus('');
  }
  connect();
})();
</script>
</body>
</html>
